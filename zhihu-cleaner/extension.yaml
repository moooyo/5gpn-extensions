apiVersion: 5gpn.io/v1
kind: Extension

metadata:
  id: io.5gpn.zhihu-cleaner
  name: Zhihu Cleaner
  version: 2.0.0
  description: Removes selected Zhihu transport overrides, advertisements, promotions,
    and navigation entries.

permissions:
  persistentStorage: false

traffic:
  captureHosts:
    - api.zhihu.com
    - m-cloud.zhihu.com
    - page-info.zhihu.com
    - www.zhihu.com
    - zhida.zhihu.com
  routingRules:
    - action: reject
      domain: api.zhihu.com
      network: udp
      destinationPort: 443
    - action: reject
      domain: m-cloud.zhihu.com
      network: udp
      destinationPort: 443
    - action: reject
      domain: page-info.zhihu.com
      network: udp
      destinationPort: 443
    - action: reject
      domain: www.zhihu.com
      network: udp
      destinationPort: 443
    - action: reject
      domain: zhida.zhihu.com
      network: udp
      destinationPort: 443

actions:
  - id: mock-api-json
    phase: request
    match:
      hosts:
        - api.zhihu.com
      schemes:
        - https
      pathRegex: '^/(?:commercial_api(?:/.*)?|root/window(?:\?.*)?|next-render(?:\?.*)?|search/preset_words(?:\?.*)?|search/related_queries/question/\d+(?:\?.*)?|content-distribution-core/bubble/common/show(?:\?.*)?|people/homepage_entry_v\d+(?:\?.*)?|kvip/right/my_card(?:\?.*)?|unlimited/go/my_card/v\d+(?:\?.*)?)$'
    script:
      source: ./mock-json.js
      bodyMode: none
      timeoutMs: 500
      maxBodyBytes: 1024

  - id: mock-www-json
    phase: request
    match:
      hosts:
        - www.zhihu.com
      schemes:
        - https
      pathRegex: '^/api/v\d+/members/homepage_card(?:\?.*)?$'
    script:
      source: ./mock-json.js
      bodyMode: none
      timeoutMs: 500
      maxBodyBytes: 1024

  - id: mock-zhida-json
    phase: request
    match:
      hosts:
        - zhida.zhihu.com
      schemes:
        - https
      pathRegex: '^/ai_ingress/(?:knowledge/square/categories/feeds(?:\?.*)?|ai_chat/guidance(?:\?.*)?)$'
    script:
      source: ./mock-json.js
      bodyMode: none
      timeoutMs: 500
      maxBodyBytes: 1024

  - id: clean-transport-config
    phase: response
    match:
      hosts:
        - m-cloud.zhihu.com
      schemes:
        - https
      pathRegex: '^/api/cloud/zhihu/config/all(?:\?.*)?$'
    script:
      jq: >-
        def drop_keys: {"km_httpdns_new_config_tars":true,"preFetchHttpDns":true,"httpdns_detector_use_concurrent":true,"httpdns_use_memory_cache":true,"httpdns_new_config_tars":true,"coreNetworkConf_useTars":true,"km_coreNetworkConf_useTars":true,"sugarQuicConfig":true,"quic_dns_detect_enable":true,"quicMixAB":true,"quic_downgrade_enable":true,"quic_priority_strategy":true,"quic_check_health_enable":true,"tquic_configuration":true,"networkExprimentList":true,"tars_ab_list":true,"zaSetExtraRequestHeader":true}; .data.configs |= map(select((drop_keys[.configKey] // false) | not) | if (.configValue | type) == "object" then del(.configValue.delayHttpdns, .configValue.dnsParser, .configValue.HTTPDNS) else . end)
      bodyMode: text
      timeoutMs: 1000
      maxBodyBytes: 8388608

  - id: clean-answer-responses
    phase: response
    match:
      hosts:
        - api.zhihu.com
        - page-info.zhihu.com
      schemes:
        - https
      pathRegex: '^/answers/v\d+/\d+(?:\?.*)?$'
    script:
      jq: >-
        del(.third_business, .float_search_word, .ring_info, .interaction_bar_plugins) | if (.structured_content | type) == "object" then .structured_content.segments |= (if type == "array" then map(select(.type != "card")) else . end) else . end
      bodyMode: text
      timeoutMs: 1000
      maxBodyBytes: 8388608

  - id: clean-root-tab
    phase: response
    match:
      hosts:
        - api.zhihu.com
      schemes:
        - https
      pathRegex: '^/root/tab(?:/v\d+)?(?:\?.*)?$'
    script:
      jq: >-
        .tab_list |= (if type == "array" then map(select(.tab_type == "follow" or .tab_type == "hot" or .tab_type == "recommend")) else . end) | if (.ring_list | type) == "array" then .ring_list = [] else . end | if (.tab_ext | type) == "object" and (.tab_ext | has("is_show_ring")) then .tab_ext.is_show_ring = false else . end
      bodyMode: text
      timeoutMs: 1000
      maxBodyBytes: 8388608

  - id: clean-topstory-recommend
    phase: response
    match:
      hosts:
        - api.zhihu.com
      schemes:
        - https
      pathRegex: '^/topstory/recommend(?:\?.*)?$'
    script:
      jq: >-
        def marker($v): ($v | type) as $t | if $t == "boolean" then $v elif $t == "string" then $v != "" elif $t == "number" then $v != 0 elif $t == "array" then ($v | length) > 0 elif $t == "object" then ($v | length) > 0 else false end; def lower($v): if ($v | type) == "string" then ($v | ascii_downcase) else "" end; def blocked: ["ad","adcard","advertisement","commercial","commercialcard","market_card","marketcard","promotion","promotioncard"]; .data |= (if type == "array" then map(select((type != "object") or ((marker(.ad_info) | not) and (marker(.commercial_info) | not) and (marker(.promotion_info) | not) and (.is_ad != true) and (.is_commercial != true) and (lower(.type) as $t | lower(.card_type) as $c | lower(.target.type) as $g | ((blocked | index($t)) | not) and ((blocked | index($c)) | not) and ((blocked | index($g)) | not))))) else . end) | .data |= (if type == "array" then map(if (type == "object") and ((.children | type) == "array") then .children |= map(select((type != "object") or (.id != "ring"))) else . end) else . end)
      bodyMode: text
      timeoutMs: 1000
      maxBodyBytes: 8388608

  - id: clean-question-feeds
    phase: response
    match:
      hosts:
        - api.zhihu.com
      schemes:
        - https
      pathRegex: '^/questions/\d+/feeds(?:\?.*)?$'
    script:
      jq: >-
        del(.ad_info)
      bodyMode: text
      timeoutMs: 1000
      maxBodyBytes: 8388608

  - id: clean-root-comment
    phase: response
    match:
      hosts:
        - api.zhihu.com
      schemes:
        - https
      pathRegex: '^/comment_v\d+/(?:answers|pins)/\d+/root_comment(?:\?.*)?$'
    script:
      jq: >-
        del(.atmosphere_voting_config)
      bodyMode: text
      timeoutMs: 1000
      maxBodyBytes: 8388608

  - id: clean-article-pin
    phase: response
    match:
      hosts:
        - api.zhihu.com
      schemes:
        - https
      pathRegex: '^/(?:articles|pins)/v\d+/\d+(?:\?.*)?$'
    script:
      jq: >-
        del(.third_business, .ring_info, .interaction_bar_plugins)
      bodyMode: text
      timeoutMs: 1000
      maxBodyBytes: 8388608

  - id: clean-comment-list-headers
    phase: response
    match:
      hosts:
        - api.zhihu.com
      schemes:
        - https
      pathRegex: '^/comment_v\d+/answers/\d+/list-headers(?:\?.*)?$'
    script:
      jq: >-
        del(.continuous_consumption_module)
      bodyMode: text
      timeoutMs: 1000
      maxBodyBytes: 8388608

  - id: clean-podcast-hub
    phase: response
    match:
      hosts:
        - api.zhihu.com
      schemes:
        - https
      pathRegex: '^/podcasts/hub/v\d+(?:\?.*)?$'
    script:
      jq: >-
        del(.banners)
      bodyMode: text
      timeoutMs: 1000
      maxBodyBytes: 8388608

  - id: clean-search-recommend-query
    phase: response
    match:
      hosts:
        - api.zhihu.com
      schemes:
        - https
      pathRegex: '^/search/recommend_query/v\d+(?:\?.*)?$'
    script:
      jq: >-
        if (.recommend_queries | type) == "object" then .recommend_queries.queries |= (if type == "array" then map(select(.type == "normal")) else . end) else . end
      bodyMode: text
      timeoutMs: 1000
      maxBodyBytes: 8388608

  - id: clean-search-result
    phase: response
    match:
      hosts:
        - api.zhihu.com
      schemes:
        - https
      pathRegex: '^/search_v\d+(?:\?.*)?$'
    script:
      jq: >-
        del(.pendant)
      bodyMode: text
      timeoutMs: 1000
      maxBodyBytes: 8388608

  - id: clean-search-tabs
    phase: response
    match:
      hosts:
        - api.zhihu.com
      schemes:
        - https
      pathRegex: '^/search/tabs(?:\?.*)?$'
    script:
      jq: >-
        .data |= (if type == "array" then map(select(.t as $t | ["ai_zhida","column","favlist","general","km_general","people","pin","podcast","publication","recent","ring","scholar","topic","zvideo"] | index($t))) else . end)
      bodyMode: text
      timeoutMs: 1000
      maxBodyBytes: 8388608

  - id: clean-people-self
    phase: response
    match:
      hosts:
        - api.zhihu.com
      schemes:
        - https
      pathRegex: '^/people/self(?:\?.*)?$'
    script:
      jq: >-
        if (.vip_info | type) == "object" then del(.vip_info.entrance_v2) | (if (.vip_info.entrance_new | type) == "object" then del(.vip_info.entrance_new.right_button) else . end) else . end
      bodyMode: text
      timeoutMs: 1000
      maxBodyBytes: 8388608
