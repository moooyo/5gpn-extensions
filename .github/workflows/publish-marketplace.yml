name: publish-marketplace

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run verify:upstreams
      - name: Generate deterministic marketplace
        run: |
          # Two profiles, one build. `v1` is frozen at what the stable core
          # accepts — it parses with DisallowUnknownFields, so a field added
          # there costs every gateway that does not know it the whole
          # catalogue. `v1beta` carries the typed policy projection for the
          # cores that have learned to read it. Publishing both from the same
          # commit is what keeps them describing the same extensions; a second
          # branch would not.
          for profile in v1 v1beta; do
            mkdir -p "_site/marketplace/${profile}"
            npm run marketplace:build -- \
              --revision "$GITHUB_SHA" --profile "$profile" \
              --output "_site/marketplace/${profile}/index.json"
            cp marketplace/schema-v1.json "_site/marketplace/${profile}/schema.json"
            npm run marketplace:build -- \
              --revision "$GITHUB_SHA" --profile "$profile" \
              --check "_site/marketplace/${profile}/index.json"
          done
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
        with:
          enablement: true
          token: ${{ secrets.PAGES_ENABLEMENT_TOKEN || github.token }}
      - name: Deploy marketplace to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
