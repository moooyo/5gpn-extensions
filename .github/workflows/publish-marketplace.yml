name: publish-marketplace

# Publishing waits for validate. Both used to fire on the same push to main
# independently, so `npm test` was the only gate this job ran -- and validate
# does strictly more: it also parses every manifest with the stable and beta
# core parsers, checked out from the gateway repository. A manifest the Node
# validator accepts and the Go parser refuses could therefore reach the
# published index, where the only thing left to catch it is an operator's
# install failing.
on:
  workflow_run:
    workflows: [validate]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    # workflow_dispatch carries no workflow_run context, so accept it on its own
    # terms; a triggered run must have succeeded and must be main.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # workflow_run checks out the default branch's tip by default, not the
      # commit that was validated, and GITHUB_SHA follows it. Both are pinned to
      # the triggering commit so the published index records the revision that
      # actually produced it.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Resolve the published revision
        run: echo "PUBLISH_REVISION=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Generate deterministic marketplace
        run: |
          # One contract, one document, one path. The contract version lives in
          # the path because that is where a reader can act on it; when it next
          # changes, that is a new path and a deliberate decision rather than a
          # build flag. The index is generated and then re-checked against what
          # was written, so a nondeterministic build fails here rather than
          # serving bytes nobody can reproduce.
          mkdir -p _site/marketplace/v2
          npm run marketplace:build -- \
            --revision "$PUBLISH_REVISION" --output _site/marketplace/v2/index.json
          cp marketplace/schema.json _site/marketplace/v2/schema.json
          npm run marketplace:build -- \
            --revision "$PUBLISH_REVISION" --check _site/marketplace/v2/index.json
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
        with:
          enablement: true
          token: ${{ secrets.PAGES_ENABLEMENT_TOKEN || github.token }}
      - name: Deploy marketplace to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
