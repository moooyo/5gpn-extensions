name: publish-marketplace

# Publishing waits for validate. Both used to fire on the same push to main
# independently, so `npm test` was the only gate this job ran -- and validate
# does strictly more: it sends every generated entry through the exact monolith
# source shipped by the installer. This job repeats that non-hermetic review so
# a manual dispatch cannot bypass it and publication fails when a live
# third-party dependency no longer passes review at publication time. External
# resources remain live dependencies and are intentionally not pinned by the
# Marketplace index after publication.
on:
  workflow_run:
    workflows: [validate]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: github-pages
  # Only the newest main revision may publish the stable marketplace URL.
  cancel-in-progress: true

jobs:
  build:
    # workflow_dispatch carries no workflow_run context, so accept it on its own
    # terms; a triggered run must have succeeded and must be main.
    #
    # `head_branch == 'main'` is not by itself a statement about this repository.
    # validate also runs on `pull_request`, and for a pull request from a fork
    # head_branch is the branch name *in the fork* -- which for a plain fork is
    # `main`. That satisfied the gate, and the checkout below then took the
    # fork's head_sha and ran npm ci / npm test from it, in this repository's
    # context, feeding an artifact to a deploy job that holds `pages: write`.
    # Because `pull_request` runs the workflow files from the PR head, the same
    # commit could also make validate trivially green. The published document is
    # the one the gateway hardcodes as its recommended marketplace, so this is
    # the whole catalogue's trust boundary.
    #
    # head_repository pins it to this repository and `event == 'push'` drops the
    # pull_request trigger as a publication source entirely.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.revision.outputs.revision }}
    permissions:
      contents: read
    env:
      MIHOMO_SOURCE_COMMIT: 46729f902c5a39a0af64b9e54ae6da4dcd02b7c1
    steps:
      # workflow_run checks out the default branch's tip by default, not the
      # commit that was validated, and GITHUB_SHA follows it. Both are pinned to
      # the triggering commit so the published index records the revision that
      # actually produced it.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Resolve and fence the published revision
        id: revision
        run: |
          revision='${{ github.event.workflow_run.head_sha || github.sha }}'
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          current_main="$(git rev-parse refs/remotes/origin/main)"
          test "$revision" = "$current_main" || {
            echo "refusing to publish stale revision $revision; current main is $current_main" >&2
            exit 1
          }
          echo "PUBLISH_REVISION=$revision" >> "$GITHUB_ENV"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Generate deterministic marketplace
        run: |
          # One contract, one document, one path. The contract version lives in
          # the path because that is where a reader can act on it; when it next
          # changes, that is a new path and a deliberate decision rather than a
          # build flag. The index is generated and then re-checked against what
          # was written, so a nondeterministic build fails here rather than
          # serving bytes nobody can reproduce.
          mkdir -p _site/marketplace/v2
          npm run marketplace:build -- \
            --revision "$PUBLISH_REVISION" --output _site/marketplace/v2/index.json
          cp marketplace/schema.json _site/marketplace/v2/schema.json
          npm run marketplace:build -- \
            --revision "$PUBLISH_REVISION" --check _site/marketplace/v2/index.json
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          repository: moooyo/mihomo
          ref: ${{ env.MIHOMO_SOURCE_COMMIT }}
          path: 5gpn-mihomo
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: 5gpn-mihomo/go.mod
          cache-dependency-path: 5gpn-mihomo/go.sum
      - name: Repeat the shipped-monolith full review before publishing
        working-directory: 5gpn-mihomo
        env:
          FIVEGPN_EXTENSIONS_ROOT: ${{ github.workspace }}
          FIVEGPN_MARKETPLACE_INDEX: ${{ github.workspace }}/_site/marketplace/v2/index.json
        run: |
          cp "$FIVEGPN_EXTENSIONS_ROOT/tests/mihomo-external-review_test.go" \
            5gpn/engine/external_extensions_test.go
          go test ./5gpn/engine -count=1 \
            -run '^TestExternalOfficialMarketplaceFullReviewCorpus$'
      - name: Recheck current main before publication
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          current_main="$(git rev-parse refs/remotes/origin/main)"
          test "$PUBLISH_REVISION" = "$current_main" || {
            echo "main advanced to $current_main while building $PUBLISH_REVISION" >&2
            exit 1
          }
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Refuse an obsolete Pages artifact
        env:
          PUBLISH_REVISION: ${{ needs.build.outputs.revision }}
        run: |
          current_main="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | awk '{print $1}')"
          test -n "$current_main"
          test "$PUBLISH_REVISION" = "$current_main" || {
            echo "refusing to deploy stale revision $PUBLISH_REVISION; current main is $current_main" >&2
            exit 1
          }
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
        with:
          enablement: true
          token: ${{ secrets.PAGES_ENABLEMENT_TOKEN || github.token }}
      - name: Deploy marketplace to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
