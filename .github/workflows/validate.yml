name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extensions:
    runs-on: ubuntu-latest
    env:
      # Source commit behind install.sh's v1.19.28-monolith.30 pin. Keep this
      # exact commit synchronized with the installer; a mutable tag or branch
      # would let CI validate a runtime other than the one operators receive.
      MIHOMO_SOURCE_COMMIT: 46729f902c5a39a0af64b9e54ae6da4dcd02b7c1
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Validate REUSE licensing metadata
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Generate core integration marketplace
        run: |
          npm run marketplace:build -- --revision "$GITHUB_SHA" --output "$RUNNER_TEMP/marketplace.json"

      # The publication gate uses the exact monolith source shipped by the
      # installer. The external test drives every generated Marketplace entry
      # through review, immutable snapshot construction, complete document
      # validation, and the real goja/gojq compilers. Absolute upstream script
      # URLs are fetched deliberately; a publisher or network failure blocks
      # publication rather than being hidden behind fixture script bytes.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          repository: moooyo/mihomo
          ref: ${{ env.MIHOMO_SOURCE_COMMIT }}
          path: 5gpn-mihomo
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: 5gpn-mihomo/go.mod
          cache-dependency-path: 5gpn-mihomo/go.sum
      - name: Review and compile the complete corpus with the shipped monolith
        working-directory: 5gpn-mihomo
        env:
          FIVEGPN_EXTENSIONS_ROOT: ${{ github.workspace }}
          FIVEGPN_MARKETPLACE_INDEX: ${{ runner.temp }}/marketplace.json
        run: |
          cp "$FIVEGPN_EXTENSIONS_ROOT/tests/mihomo-external-review_test.go" \
            5gpn/engine/external_extensions_test.go
          grep -Fq 'func TestExternalOfficialMarketplaceFullReviewCorpus' \
            5gpn/engine/external_extensions_test.go
          go test ./5gpn/engine -count=1 \
            -run '^TestExternalOfficialMarketplaceFullReviewCorpus$'
