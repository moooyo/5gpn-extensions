name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extensions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Validate REUSE licensing metadata
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Generate core integration marketplace
        run: |
          npm run marketplace:build -- --revision "$GITHUB_SHA" --output "$RUNNER_TEMP/marketplace.json"

      # The index is checked against both core channels because it is a wire
      # contract with each: the core parses it with DisallowUnknownFields, so a
      # field either channel does not know costs those gateways their whole
      # catalogue rather than one entry. Checking only the channel a field lands
      # on first is what would let that through.
      # jq is this catalogue's main action kind and nothing here can compile
      # one: gojq lives in the sidecar. Without this step a manifest carrying an
      # unbalanced expression passes every gate and fails at an operator's
      # install. The expressions are handed over as JSON because the sidecar's
      # module has a fixed dependency list that does not include yaml.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          repository: moooyo/mihomo-extension-sidecar
          ref: main
          path: 5gpn-sidecar
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          repository: moooyo/5gpn
          ref: main
          path: 5gpn-core-stable
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          repository: moooyo/5gpn
          ref: beta
          path: 5gpn-core-beta
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: 5gpn-core-stable/cmd/5gpn-dns/go.mod
          cache-dependency-path: 5gpn-core-stable/cmd/*/go.sum
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: 5gpn-sidecar/go.mod
          cache-dependency-path: 5gpn-sidecar/go.sum
      - name: Compile every jq expression with the engine that runs them
        run: |
          node scripts/extract-jq.mjs "${{ runner.temp }}/jq-programs.json"
          cd 5gpn-sidecar
          grep -Fq 'func TestExternalMaintainedJQProgramsCompile' module_jq_test.go
          FIVEGPN_JQ_PROGRAMS="${{ runner.temp }}/jq-programs.json"             go test ./... -count=1 -run '^TestExternalMaintainedJQProgramsCompile$'
      - name: Validate with the stable core parser
        working-directory: 5gpn-core-stable/cmd/5gpn-dns
        env:
          FIVEGPN_EXTENSIONS_ROOT: ${{ github.workspace }}
          FIVEGPN_MARKETPLACE_INDEX: ${{ runner.temp }}/marketplace.json
        run: |
          grep -Fq 'func TestExternalMaintainedExtensionsAreInstallableFromURL' intercept_module_parser_test.go
          grep -Fq 'func TestExternalMaintainedMarketplaceMatchesCoreContract' extension_marketplace_test.go
          go test ./... -count=1 -run '^(TestExternalMaintainedExtensionsAreInstallableFromURL|TestExternalMaintainedMarketplaceMatchesCoreContract)$'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: 5gpn-core-beta/cmd/5gpn-dns/go.mod
          cache-dependency-path: 5gpn-core-beta/cmd/*/go.sum
      - name: Validate with the beta core parser
        working-directory: 5gpn-core-beta/cmd/5gpn-dns
        env:
          FIVEGPN_EXTENSIONS_ROOT: ${{ github.workspace }}
          FIVEGPN_MARKETPLACE_INDEX: ${{ runner.temp }}/marketplace.json
        run: |
          grep -Fq 'func TestExternalMaintainedExtensionsAreInstallableFromURL' intercept_module_parser_test.go
          grep -Fq 'func TestExternalMaintainedMarketplaceMatchesCoreContract' extension_marketplace_test.go
          go test ./... -count=1 -run '^(TestExternalMaintainedExtensionsAreInstallableFromURL|TestExternalMaintainedMarketplaceMatchesCoreContract)$'
