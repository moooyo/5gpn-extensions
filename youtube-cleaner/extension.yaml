apiVersion: 5gpn.io/v1
kind: Extension

metadata:
  id: io.5gpn.youtube-cleaner
  name: YouTube Application Cleaner
  version: 2.0.0
  description: Cleans YouTube application responses and restores selected playback and caption capabilities.

permissions:
  persistentStorage: true
  network:
    origins:
      - https://translate.google.com

traffic:
  captureHosts:
    - "*.googlevideo.com"
    - youtubei.googleapis.com
  routingRules:
    - action: reject
      domainSuffix: googlevideo.com
      network: udp
    - action: reject
      domain: youtubei.googleapis.com
      network: udp

settings:
  - key: blockUpload
    type: boolean
    label: Hide uploads entry
    description: Removes the uploads entry from the YouTube guide.
    required: true
    default: true
  - key: blockImmersive
    type: boolean
    label: Hide immersive music entry
    description: Removes the immersive music entry from the YouTube guide.
    required: true
    default: true
  - key: blockShorts
    type: boolean
    label: Hide Shorts guide entry
    description: Removes the Shorts entry from the guide; feed ad heuristics remain independent.
    required: true
    default: false
  - key: captionLang
    type: text
    label: Preferred caption language
    description: Uses a bounded language code such as en or zh-Hans, or off to disable caption rewriting.
    required: true
    default: "off"
  - key: lyricLang
    type: text
    label: Lyric translation language
    description: Uses a bounded language code or off; eligible music text is sent to the declared Google Translate origin.
    required: true
    default: "off"
  - key: debug
    type: boolean
    label: Debug logging
    description: Logs bounded endpoint transformation counters without logging response content.
    required: true
    default: false

actions:
  - id: block-ad-initplayback
    phase: request
    match:
      hosts:
        - "*.googlevideo.com"
      schemes:
        - http
        - https
      pathRegex: '^/initplayback.+&oad.*$'
    script:
      source: ./block-initplayback.js
      bodyMode: none
      timeoutMs: 250
      maxBodyBytes: 1024

  - id: clean-youtube-response
    phase: response
    match:
      hosts:
        - youtubei.googleapis.com
      schemes:
        - https
      pathRegex: '^/youtubei/v1/(browse|next|player|search|reel/reel_watch_sequence|guide|account/get_setting|get_watch)(\?.*)?$'
    script:
      source: ./clean-player.js
      bodyMode: binary
      timeoutMs: 10000
      maxBodyBytes: 16777216
