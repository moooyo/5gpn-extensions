apiVersion: 5gpn.io/v1
kind: Extension

metadata:
  id: io.5gpn.youtube-cleaner
  name: YouTube Application Cleaner
  version: 3.0.0
  description: Cleans YouTube responses and prepares the reviewed external Onesie playback path.

permissions:
  persistentStorage: true
  network:
    origins:
      - https://init-stream.maasea.workers.dev

traffic:
  captureHosts:
    - "*.googlevideo.com"
    - youtubei.googleapis.com

settings:
  - key: blockUpload
    type: boolean
    label: Hide uploads entry
    description: Removes the uploads entry from the YouTube guide.
    required: true
    default: true
  - key: blockImmersive
    type: boolean
    label: Hide immersive music entry
    description: Removes the immersive music entry from the YouTube guide.
    required: true
    default: true
  - key: blockShorts
    type: boolean
    label: Hide Shorts guide entry
    description: Removes the Shorts entry from the guide; feed ad heuristics remain independent.
    required: true
    default: false
  - key: captionLang
    type: text
    label: Preferred caption language
    description: Uses a bounded language code such as en or zh-Hans, or off to disable caption rewriting.
    required: true
    default: "off"
  - key: debug
    type: boolean
    label: Debug logging
    description: Logs bounded endpoint transformation counters without logging response content.
    required: true
    default: false

actions:
  - id: prepare-onesie-initplayback
    phase: request
    match:
      hosts:
        - "*.googlevideo.com"
      schemes:
        - http
        - https
      pathRegex: '^/initplayback.+&ack.*$'
    script:
      source: ./request-handler.js
      bodyMode: binary
      timeoutMs: 1000
      maxBodyBytes: 4194304

  - id: prepare-youtube-log-event
    phase: request
    match:
      hosts:
        - youtubei.googleapis.com
      schemes:
        - https
      pathRegex: '^/youtubei/v1/log_event(\?.*)?$'
    script:
      source: ./request-handler.js
      bodyMode: none
      timeoutMs: 250
      maxBodyBytes: 1024

  - id: clean-youtube-response
    phase: response
    match:
      hosts:
        - youtubei.googleapis.com
      schemes:
        - https
      pathRegex: '^/youtubei/v1/(browse|next|player|search|reel/reel_watch_sequence|guide|account/get_setting|get_watch|log_event|config)(\?.*)?$'
    script:
      source: ./clean-player.js
      bodyMode: binary
      timeoutMs: 10000
      maxBodyBytes: 16777216
