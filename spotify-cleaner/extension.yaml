apiVersion: 5gpn.io/v1
kind: Extension

metadata:
  id: io.5gpn.spotify-cleaner
  name: Spotify Cleaner
  version: 1.0.0
  description: Rewrites a reviewed subset of Spotify account attributes without claiming server-side entitlement changes.

permissions:
  persistentStorage: false

traffic:
  captureHosts:
    - spclient.wg.spotify.com

actions:
  - id: clean-bootstrap-response
    phase: response
    match:
      hosts:
        - spclient.wg.spotify.com
      schemes:
        - https
      pathRegex: '^/bootstrap'
      statusCodes:
        - 200
    script:
      source: ./clean-response.js
      bodyMode: binary
      timeoutMs: 5000
      maxBodyBytes: 8388608

  - id: clean-user-customization-response
    phase: response
    match:
      hosts:
        - spclient.wg.spotify.com
      schemes:
        - https
      pathRegex: '^/user-customization-service'
      statusCodes:
        - 200
    script:
      source: ./clean-response.js
      bodyMode: binary
      timeoutMs: 5000
      maxBodyBytes: 8388608
