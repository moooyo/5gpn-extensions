      bodyMode: none
      timeoutMs: 500
      maxBodyBytes: 1024

  - id: block-pdd-video-dsp
    phase: request
    match:
      hosts:
        - video-dsp.pddpic.com
      schemes:
        - https
      pathRegex: '^/market-dsp-video/'
    script:
      source: ./block.js
      bodyMode: none
      timeoutMs: 500
      maxBodyBytes: 1024

  - id: block-pdd-dsp-callback
    phase: request
    match:
      hosts:
        - t-dsp.pinduoduo.com
      schemes:
        - https
      pathRegex: '^/dspcb/i/mrk_'
    script:
      source: ./block.js
      bodyMode: none
      timeoutMs: 500
      maxBodyBytes: 1024

  - id: block-pdd-marketing-images
    phase: request
    match:
      hosts:
        - images.pinduoduo.com
      schemes:
        - https
      pathRegex: '^/(mrk/|marketing_api/)'
    script:
      source: ./block.js
      bodyMode: none
      timeoutMs: 500
      maxBodyBytes: 1024
