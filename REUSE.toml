version = 1

[[annotations]]
path = [
  ".github/workflows/*",
  ".gitattributes",
  ".gitignore",
  "AGENTS.md",
  "CLAUDE.md",
  "KELEEONE-LICENSE.md",
  "LICENSE",
  "MIGRATION.md",
  "README.md",
  "README.zh-CN.md",
  "THIRD_PARTY_NOTICES.md",
  "marketplace/*",
  "package.json",
  "package-lock.json",
  "scripts/*",
  "tests/*",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 moooyo"
SPDX-License-Identifier = "MIT"

