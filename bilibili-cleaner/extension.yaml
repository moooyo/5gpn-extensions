apiVersion: 5gpn.io/v1
kind: Extension

metadata:
  id: io.5gpn.bilibili-cleaner
  name: Bilibili Cleaner
  version: 4.0.1
  description: Runs the reviewed kokoryh/Sparkle Bilibili scripts and rewrite rules against the Bilibili app.

permissions:
  persistentStorage: true
  network: true

requirements:
  egressGroup:
    required: false

traffic:
  captureHosts:
    - api.bilibili.com
    - api.live.bilibili.com
    - app.bilibili.com
    - grpc.biliapi.net
    - line3-h5-mobile-api.biligame.com
    - www.bilibili.com
  routingRules:
    - action: reject
      domain: api.biliapi.com
    - action: reject
      domain: app.biliapi.com
    - action: reject
      domain: api.biliapi.net
    - action: reject
      domain: app.biliapi.net
    - action: reject
      domainSuffix: chat.bilibili.com
      domainKeywords:
        - p2p
        - stun
        - tracker

settings:
  - key: displayUpList
    type: select
    label: Frequent uploader list
    description: Shows, hides, or automatically shows Dynamic's frequently visited uploader list when an entry is live.
    required: true
    options:
      - show
      - hide
      - auto
    default: show
  - key: purifyComment
    type: boolean
    label: Filter promoted top replies
    description: Removes promoted top replies matching the reviewed links or shopping keywords.
    required: true
    default: true
  - key: optimizeRequest
    type: boolean
    label: Optimize comment loading
    description: Replays and cleans selected video and comment RPCs before returning them to the client.
    required: true
    default: true
  - key: sponsorBlock
    type: boolean
    label: Enable airborne helper
    description: Enables the SponsorBlock airborne danmaku and the commit-pinned Chronos client helper. Turning it off also stops the bsbsb.top segment lookup, because the action that performs it is not loaded.
    required: true
    default: true
  - key: logLevel
    type: select
    label: Script log level
    description: Selects the log level used by the reviewed Bilibili scripts.
    required: true
    options:
      - error
      - warn
      - info
      - debug
      - off
    default: error

actions:
  - id: mock-live-shopping-json
    phase: request
    match:
      hosts:
        - api.live.bilibili.com
      schemes:
        - https
      pathRegex: '^/xlive/e-commerce-interface/v1/ecommerce-user/get_shopping_info\?.*$'
    script:
      mock:
        status: 200
        headers:
          Content-Type: 'application/json; charset=utf-8'
        body: '{}'
      bodyMode: none
      timeoutMs: 500
      maxBodyBytes: 1024

  - id: mock-game-live-card-json
    phase: request
    match:
      hosts:
        - line3-h5-mobile-api.biligame.com
      schemes:
        - https
      pathRegex: '^/game/live/large_card_material\?.*$'
    script:
      mock:
        status: 200
        headers:
          Content-Type: 'application/json; charset=utf-8'
        body: '{}'
      bodyMode: none
      timeoutMs: 500
      maxBodyBytes: 1024

  - id: mock-app-splash-list
    phase: request
    match:
      hosts:
        - app.bilibili.com
      schemes:
        - https
      pathRegex: '^/x/v2/splash/list\?.*$'
    script:
      mock:
        status: 200
        headers:
          Content-Type: 'application/json; charset=utf-8'
        body: '{"code":0,"message":"OK","ttl":1,"data":{"max_time":0,"min_interval":31536000,"pull_interval":31536000,"keep_ids":[],"show":[],"list":[{}],"splash_request_id":""}}'
      bodyMode: none
      timeoutMs: 500
      maxBodyBytes: 1024

  - id: mock-app-promotions-json
    phase: request
    match:
      hosts:
        - api.bilibili.com
        - app.bilibili.com
      schemes:
        - https
      pathRegex: '^/x/(?:resource/(?:top/activity|patch/tab(?:/v2)?)|v2/search/square|vip/ads/materials)\?.*$'
    script:
      mock:
        status: 200
        headers:
          Content-Type: 'application/json; charset=utf-8'
        body: '{"code":-404,"message":"-404","ttl":1,"data":null}'
      bodyMode: none
      timeoutMs: 500
      maxBodyBytes: 1024

  - id: mock-api-delivery-json
    phase: request
    match:
      hosts:
        - api.bilibili.com
      schemes:
        - https
      pathRegex: '^/pgc/activity/deliver/material/receive\?.*$'
    script:
      mock:
        status: 200
        headers:
          Content-Type: 'application/json; charset=utf-8'
        body: '{"code":0,"data":{"closeType":"close_win","container":[],"showTime":""},"message":"success"}'
      bodyMode: none
      timeoutMs: 500
      maxBodyBytes: 1024

  - id: mock-grpc-teenagers
    phase: request
    match:
      hosts:
        - grpc.biliapi.net
      schemes:
        - https
      pathRegex: '^/bilibili\.app\.interface\.v1\.Teenagers/ModeStatus$'
    script:
      mock:
        status: 200
        headers:
          Content-Type: 'application/grpc'
          Grpc-Status: '0'
        base64Body: 'AAAAABMKEQgCEgl0ZWVuYWdlcnMgAioA'
      bodyMode: none
      timeoutMs: 500
      maxBodyBytes: 1024

  - id: mock-grpc-default-words
    phase: request
    match:
      hosts:
        - grpc.biliapi.net
      schemes:
        - https
      pathRegex: '^/bilibili\.app\.interface\.v1\.Search/DefaultWords$'
    script:
      mock:
        status: 200
        headers:
          Content-Type: 'application/grpc'
          Grpc-Status: '0'
        base64Body: 'AAAAACEaHeaQnOe0ouinhumikeOAgeeVquWJp+aIlnVw5Li7KAE='
      bodyMode: none
      timeoutMs: 500
      maxBodyBytes: 1024

  - id: mock-grpc-empty-frames
    phase: request
    match:
      hosts:
        - grpc.biliapi.net
      schemes:
        - https
      pathRegex: '^/bilibili\.app\.(?:view\.v1\.View/TFInfo|viewunite\.v1\.View/(?:PlayPause|ViewEndPage))$'
    script:
      mock:
        status: 200
        headers:
          Content-Type: 'application/grpc'
          Grpc-Status: '0'
        base64Body: 'AAAAAAA='
      bodyMode: none
      timeoutMs: 500
      maxBodyBytes: 1024

  - id: clean-live-tracker-conf
    phase: response
    match:
      hosts:
        - api.live.bilibili.com
      schemes:
        - https
      pathRegex: '^/xlive/open-interface/v2/tracker/conf\?.*$'
    script:
      jq: >-
        if (.data | type) == "object" then (
        .data.domains=["wss://tracker.chat.bilibili.com"]
        ) else . end
      bodyMode: text
      timeoutMs: 1000
      maxBodyBytes: 8388608

  - id: clean-pd-proxy-tracker
    phase: response
    match:
      hosts:
        - api.bilibili.com
      schemes:
        - https
      pathRegex: '^/x/pd-proxy/tracker\?.*$'
    script:
      jq: >-
        .data[]?[]? = "stun.chat.bilibili.com:3478"
      bodyMode: text
      timeoutMs: 1000
      maxBodyBytes: 8388608

  - id: clean-pgc-season
    phase: response
    match:
      hosts:
        - api.bilibili.com
      schemes:
        - https
      pathRegex: '^/pgc/view/v2/app/season\?.*$'
    script:
      jq: >-
        if (.data | type) == "object" then (
        del(.data.payment)
        ) else . end
      bodyMode: text
      timeoutMs: 1000
      maxBodyBytes: 8388608

  - id: clean-pgc-channel
    phase: response
    match:
      hosts:
        - api.bilibili.com
      schemes:
        - https
      pathRegex: '^/pgc/page/channel\?.*$'
    script:
      jq: >-
        if (.data | type) == "object" then (
        if (.data.modules | type) == "array" then .data.modules |= map(select((type != "object") or (.type != "TIP")) | if (type == "object") and (.type == "BANNER") and ((.module_data | type) == "object") and ((.module_data.items | type) == "array") then .module_data.items |= map(select(((.url | type) != "string") or ((.url | startswith("https://www.bilibili.com/blackboard/era/")) | not))) else . end) else . end
        ) else . end
      bodyMode: text
      timeoutMs: 1000
      maxBodyBytes: 8388608

