apiVersion: 5gpn.io/v1
kind: Extension

metadata:
  id: io.5gpn.bilibili-cleaner
  name: Bilibili Cleaner
  version: 1.0.0
  description: Removes bounded advertising and promotional response shapes from the Bilibili app.

permissions:
  persistentStorage: false

traffic:
  captureHosts:
    - api.bilibili.com
    - api.live.bilibili.com
    - app.bilibili.com
    - grpc.biliapi.net
    - line3-h5-mobile-api.biligame.com

actions:
  - id: rewrite-channel-request
    phase: request
    match:
      hosts:
        - api.bilibili.com
      schemes:
        - https
      methods:
        - GET
      pathRegex: '^/pgc/page/channel\?.*&mobi_app=iphone&.*$'
    script:
      source: ./rewrite-channel.js
      bodyMode: none
      timeoutMs: 500
      maxBodyBytes: 1024

  - id: mock-grpc-promotions
    phase: request
    match:
      hosts:
        - grpc.biliapi.net
      schemes:
        - https
      methods:
        - POST
      pathRegex: '^/bilibili\.(app\.interface\.v1\.(Teenagers/ModeStatus|Search/DefaultWords)|app\.view\.v1\.View/TFInfo)$'
    script:
      source: ./mock-grpc.js
      bodyMode: none
      timeoutMs: 500
      maxBodyBytes: 1024

  - id: mock-live-shopping-json
    phase: request
    match:
      hosts:
        - api.live.bilibili.com
      schemes:
        - https
      methods:
        - GET
        - POST
      pathRegex: '^/xlive/e-commerce-interface/v1/ecommerce-user/get_shopping_info(\?.*)?$'
    script:
      source: ./mock-json.js
      bodyMode: none
      timeoutMs: 500
      maxBodyBytes: 1024

  - id: mock-game-live-card-json
    phase: request
    match:
      hosts:
        - line3-h5-mobile-api.biligame.com
      schemes:
        - https
      methods:
        - GET
        - POST
      pathRegex: '^/game/live/large_card_material(\?.*)?$'
    script:
      source: ./mock-json.js
      bodyMode: none
      timeoutMs: 500
      maxBodyBytes: 1024

  - id: clean-app-json
    phase: response
    match:
      hosts:
        - app.bilibili.com
      schemes:
        - https
      methods:
        - GET
        - POST
      pathRegex: '^/x/(v2/splash/(list|show|event/list2)|resource/show/(tab/v2|skin)|v2/feed/index|v2/feed/index/story|v2/account/mine(/ipad)?|resource/(top/activity|patch/tab)|v2/search/square|vip/ads/materials)(\?.*)?$'
      statusCodes:
        - 200
    script:
      source: ./clean-json.js
      bodyMode: text
      timeoutMs: 1000
      maxBodyBytes: 8388608

  - id: clean-api-json
    phase: response
    match:
      hosts:
        - api.bilibili.com
      schemes:
        - https
      methods:
        - GET
        - POST
      pathRegex: '^/(x/pd-proxy/tracker|pgc/activity/deliver/material/receive|pgc/view/v2/app/season)(\?.*)?$'
      statusCodes:
        - 200
    script:
      source: ./clean-json.js
      bodyMode: text
      timeoutMs: 1000
      maxBodyBytes: 8388608

  - id: clean-live-json
    phase: response
    match:
      hosts:
        - api.live.bilibili.com
      schemes:
        - https
      methods:
        - GET
        - POST
      pathRegex: '^/xlive/(app-interface/v2/index/feed|app-room/v1/index/getInfoBy(Room|User))(\?.*)?$'
      statusCodes:
        - 200
    script:
      source: ./clean-json.js
      bodyMode: text
      timeoutMs: 1000
      maxBodyBytes: 8388608
