apiVersion: 5gpn.io/v1
kind: Extension

metadata:
  id: io.5gpn.bilibili-cleaner
  name: Bilibili Cleaner
  version: 2.1.0
  description: Removes bounded advertising and promotional response shapes from the Bilibili app.

permissions:
  persistentStorage: false
  network:
    origins:
      - https://app.bilibili.com
      - https://bsbsb.top
      - https://grpc.biliapi.net

requirements:
  egressGroup:
    required: true

traffic:
  captureHosts:
    - api.bilibili.com
    - api.live.bilibili.com
    - app.bilibili.com
    - grpc.biliapi.net
    - line3-h5-mobile-api.biligame.com
    - www.bilibili.com
  routingRules:
    - action: reject
      domain: api.biliapi.com
    - action: reject
      domain: app.biliapi.com
    - action: reject
      domain: api.biliapi.net
    - action: reject
      domain: app.biliapi.net
    - action: reject
      domainSuffix: chat.bilibili.com
      domainKeywords:
        - p2p
        - stun
        - tracker

settings:
  - key: displayUpList
    type: select
    label: Frequent uploader list
    description: Shows, hides, or automatically shows Dynamic's frequently visited uploader list when an entry is live.
    required: true
    options:
      - show
      - hide
      - auto
    default: show
  - key: purifyComment
    type: boolean
    label: Filter promoted top replies
    description: Removes promoted top replies matching the reviewed links or shopping keywords.
    required: true
    default: true
  - key: optimizeRequest
    type: boolean
    label: Optimize comment loading
    description: Replays and cleans selected video and comment RPCs before returning them to the client.
    required: true
    default: true
  - key: sponsorBlock
    type: boolean
    label: Enable airborne helper
    description: Enables SponsorBlock danmaku and the commit-pinned Chronos client helper.
    required: true
    default: true
  - key: logLevel
    type: select
    label: Script log level
    description: Selects the log level used by the reviewed Bilibili scripts.
    required: true
    options:
      - error
      - warn
      - info
      - debug
      - off
    default: error

actions:
  - id: mock-grpc-promotions
    phase: request
    match:
      hosts:
        - grpc.biliapi.net
      schemes:
        - https
      methods:
        - POST
      pathRegex: '^/bilibili\.app\.(interface\.v1\.(Teenagers/ModeStatus|Search/DefaultWords)|view\.v1\.View/TFInfo|viewunite\.v1\.View/(PlayPause|ViewEndPage))$'
    script:
      source: ./mock-grpc.js
      bodyMode: none
      timeoutMs: 500
      maxBodyBytes: 1024

  - id: mock-live-shopping-json
    phase: request
    match:
      hosts:
        - api.live.bilibili.com
      schemes:
        - https
      pathRegex: '^/xlive/e-commerce-interface/v1/ecommerce-user/get_shopping_info\?.*$'
    script:
      source: ./mock-json.js
      bodyMode: none
      timeoutMs: 500
      maxBodyBytes: 1024

  - id: mock-game-live-card-json
    phase: request
    match:
      hosts:
        - line3-h5-mobile-api.biligame.com
      schemes:
        - https
      pathRegex: '^/game/live/large_card_material\?.*$'
    script:
      source: ./mock-json.js
      bodyMode: none
      timeoutMs: 500
      maxBodyBytes: 1024

  - id: mock-app-promotions-json
    phase: request
    match:
      hosts:
        - api.bilibili.com
        - app.bilibili.com
      schemes:
        - https
      pathRegex: '^/x/(v2/splash/list|resource/(top/activity|patch/tab(/v2)?)|v2/search/square|vip/ads/materials)\?.*$'
    script:
      source: ./mock-json.js
      bodyMode: none
      timeoutMs: 500
      maxBodyBytes: 1024

  - id: mock-api-delivery-json
    phase: request
    match:
      hosts:
        - api.bilibili.com
      schemes:
        - https
      pathRegex: '^/pgc/activity/deliver/material/receive\?.*$'
    script:
      source: ./mock-json.js
      bodyMode: none
      timeoutMs: 500
      maxBodyBytes: 1024

  - id: transform-protobuf-requests
    phase: request
    match:
      hosts:
        - app.bilibili.com
        - grpc.biliapi.net
      schemes:
        - https
      methods:
        - POST
      pathRegex: '^/bilibili\.(community\.service\.dm\.v1\.DM/DmSegMobile|app\.viewunite\.v1\.View/View|main\.community\.reply\.v1\.Reply/MainList)$'
    script:
      source: ./protobuf.js
      bodyMode: binary
      timeoutMs: 12000
      maxBodyBytes: 1048576

  - id: clean-app-json
    phase: response
    match:
      hosts:
        - app.bilibili.com
      schemes:
        - https
      pathRegex: '^/x/(v2/splash/(show|event/list2)|resource/show/(tab/v2|skin)|v2/feed/index|v2/feed/index/story|v2/account/(mine(/ipad)?|myinfo))\?.*$'
    script:
      source: ./clean-json.js
      bodyMode: text
      timeoutMs: 1000
      maxBodyBytes: 8388608

  - id: clean-api-json
    phase: response
    match:
      hosts:
        - api.bilibili.com
      schemes:
        - https
      pathRegex: '^/(x/pd-proxy/tracker|pgc/(view/v2/app/season|page/channel))\?.*$'
    script:
      source: ./clean-json.js
      bodyMode: text
      timeoutMs: 1000
      maxBodyBytes: 8388608

  - id: clean-live-json
    phase: response
    match:
      hosts:
        - api.live.bilibili.com
      schemes:
        - https
      pathRegex: '^/xlive/(open-interface/v2/tracker/conf|app-interface/v2/index/feed|app-room/v1/index/getInfoBy(Room|User))\?.*$'
    script:
      source: ./clean-json.js
      bodyMode: text
      timeoutMs: 1000
      maxBodyBytes: 8388608

  - id: clean-protobuf-responses
    phase: response
    match:
      hosts:
        - app.bilibili.com
        - grpc.biliapi.net
      schemes:
        - https
      methods:
        - POST
      pathRegex: '^/bilibili\.(app\.(show\.v1\.Popular/Index|dynamic\.v2\.Dynamic/DynAll|view(unite)?\.v1\.View/(View|ViewProgress|RelatesFeed)|playurl\.v1\.PlayURL/PlayView|playerunite\.v1\.Player/PlayViewUnite)|polymer\.app\.search\.v1\.Search/SearchAll|community\.service\.dm\.v1\.DM/DmView|main\.community\.reply\.v1\.Reply/MainList|pgc\.gateway\.player\.v2\.PlayURL/PlayView)$'
    script:
      source: ./protobuf.js
      bodyMode: binary
      timeoutMs: 3000
      maxBodyBytes: 8388608

  - id: purify-live-activity-page
    phase: response
    match:
      hosts:
        - www.bilibili.com
      schemes:
        - https
      pathRegex: '^/blackboard/era/.+\.html\?.*$'
    script:
      source: ./inject-live-page.js
      bodyMode: text
      timeoutMs: 1000
      maxBodyBytes: 8388608
