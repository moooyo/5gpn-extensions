  - id: clean-app-myinfo
    phase: response
    match:
      hosts:
        - app.bilibili.com
      schemes:
        - https
      pathRegex: '^/x/v2/account/myinfo\?.*$'
    script:
      jq: >-
        if (.data | type) == "object" then (
        .data.vip |= if . != null and .status == 0 then . + { status: 1, type: 2, due_date: 9005270400000, role: 15 } else . end
        ) else . end
      bodyMode: text
      timeoutMs: 1000
      maxBodyBytes: 8388608

  - id: transform-airborne
    phase: request
    enabledWhen:
      key: sponsorBlock
      equals: "true"
    match:
      hosts:
        - app.bilibili.com
        - grpc.biliapi.net
      schemes:
        - https
      methods:
        - POST
      pathRegex: '^/bilibili\.community\.service\.dm\.v1\.DM/DmSegMobile$'
    script:
      source: https://raw.githubusercontent.com/kokoryh/Sparkle/12e89d6d93d72d39eb283ef81d2b58eb204cdb58/dist/bilibili.protobuf.request.js
      entry: proxy-compat
      bodyMode: binary
      timeoutMs: 12000
      maxBodyBytes: 1048576

  - id: transform-optimized-request
