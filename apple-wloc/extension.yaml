apiVersion: 5gpn.io/v1
kind: Extension

metadata:
  id: io.5gpn.apple-wloc
  name: Apple WLOC Location Override
  version: 4.0.0
  description: Runs the reviewed Yu9191/wloc scripts against Apple Wi-Fi and cellular location responses.

permissions:
  persistentStorage: true

traffic:
  # Upstream widened its response matcher and [MITM] hostname list from the two
  # gs-loc names to the five WLOC endpoints it has observed. The two Apple names
  # serve the global and mainland paths; gsp-ssl.ls.apple.com serves the same
  # /clls/wloc protobuf; the two bluedot names are the AutoNavi endpoint Apple
  # uses inside mainland China and its Alibaba-DNS suffixed alias. The settings
  # -save request line was NOT widened upstream, so it stays on the two gs-loc
  # names below rather than inheriting this list.
  captureHosts:
    - gs-loc.apple.com
    - gs-loc-cn.apple.com
    - gsp-ssl.ls.apple.com
    - bluedot.is.autonavi.com
    - bluedot.is.autonavi.com.gds.alibabadns.com

settings:
  # Typed `number`, not `text`, for two reasons beyond the obvious one.
  #
  # A same-ID update retains a stored value only when the key AND the type both
  # match, so changing the type is what drops the coordinate an existing install
  # carries. That matters here: every 2.0.x install persisted upstream's own
  # 113.94114/22.544577 as a value, and upstream reads exactly that pair with
  # empty storage as "unconfigured" -- it nulls the coordinates and returns the
  # response untouched. Dropping the default alone would have fixed only fresh
  # installs and left every existing one reporting ready while patching nothing.
  #
  # `number` also carries min/max, which the console and the daemon both
  # enforce; a `text` coordinate accepts any non-empty string on both sides.
  # The reviewed settings-save bundle now validates the same +-180/+-90 range on
  # the picker path, so the two boundaries agree instead of only this one.
  #
  # No default: the extension stays not-ready until an operator sets a point,
  # which is the honest state for a location override nobody has aimed yet.
  - key: longitude
    type: number
    label: Longitude
    description: Target longitude in decimal degrees. A point saved from the online picker takes precedence.
    required: true
    min: -180
    max: 180
  - key: latitude
    type: number
    label: Latitude
    description: Target latitude in decimal degrees. A point saved from the online picker takes precedence.
    required: true
    min: -90
    max: 90
  - key: accuracy
    type: number
    label: Accuracy
    description: Reported horizontal accuracy in metres.
    required: true
    min: 1
    max: 100000
    default: 25
  # Upstream's [Argument] block declares `logLevel`. The response transformer
  # reads both spellings and lets the capital one win; the settings-save script
  # reads only `$argument.LogLevel`, so under upstream's own key that second
  # script never gets the level. `LogLevel` is the one spelling both scripts
  # read. The options and default remain upstream's.
  - key: LogLevel
    type: select
    label: Script log level
    description: Selects the log level used by the reviewed WLOC scripts.
    required: true
    options:
      - "off"
      - error
      - warn
      - info
      - debug
      - all
    default: info
  # The manifest boundary follows the upstream picker, which accepts 0..5000.
  # The upstream bundles themselves enforce no upper bound on a value written
  # directly through the settings-save request, and a persisted value takes
  # precedence over this argument until it is replaced or cleared.
  - key: randomRadius
    type: number
    label: Random radius
    description: Random offset radius in metres. Zero disables it; a value saved from the online picker takes precedence.
    required: true
    min: 0
    max: 5000
    default: 0

actions:
  - id: rewrite-wloc-response
    phase: response
    match:
      hosts:
        - gs-loc.apple.com
        - gs-loc-cn.apple.com
        - gsp-ssl.ls.apple.com
        - bluedot.is.autonavi.com
        - bluedot.is.autonavi.com.gds.alibabadns.com
      schemes:
        - https
      pathRegex: '^/clls/wloc(?:\?.*)?$'
    script:
      source: https://raw.githubusercontent.com/Yu9191/wloc/ea204aedfd36b3d407c3506ac25db506a6c1b419/dist/wloc.js
      entry: proxy-compat
      bodyMode: binary
      timeoutMs: 30000
      maxBodyBytes: 8388608

  # Upstream's `WLOC Settings` line still matches only gs-loc(-cn).apple.com. The
  # host expansion above applies to the response matcher alone, so widening this
  # action would exceed the reviewed upstream module rather than track it.
  - id: save-wloc-settings
    phase: request
    match:
      hosts:
        - gs-loc.apple.com
        - gs-loc-cn.apple.com
      schemes:
        - https
      pathRegex: '^/wloc-settings/save(?:\?.*)?$'
    script:
      source: https://raw.githubusercontent.com/Yu9191/wloc/ea204aedfd36b3d407c3506ac25db506a6c1b419/dist/wloc-settings.js
      entry: proxy-compat
      bodyMode: none
      timeoutMs: 10000
      maxBodyBytes: 1024
