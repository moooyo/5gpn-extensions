actions:
  - id: block-huya-httpdns-launch
    phase: request
    match:
      hosts:
        - cdn.wup.huya.com
      schemes:
        - http
      pathRegex: ^/launch/queryHttpDns
    script:
      reject: true
      bodyMode: none
      timeoutMs: 200
      maxBodyBytes: 1024
  - id: block-huya-httpdns-monitor
    phase: request
    match:
      hosts:
        - cdn.wup.huya.com
      schemes:
        - http
        - https
      pathRegex: ^/monitor/monitor\.jsp
    script:
      reject: true
      bodyMode: none
      timeoutMs: 200
      maxBodyBytes: 1024
  - id: block-ximalaya-httpdns-login
    phase: request
    match:
      hosts:
        - xmc.ximalaya.com
      schemes:
        - http
      pathRegex: ^/xmlymain-login-web/login/
    script:
      reject: true
      bodyMode: none
      timeoutMs: 200
      maxBodyBytes: 1024
  - id: block-weibo-httpdns-config
    phase: request
    match:
      hosts:
        - api.weibo.cn
      schemes:
        - http
      pathRegex: ^/(?:2/)?httpdns/config
    script:
      reject: true
      bodyMode: none
      timeoutMs: 200
      maxBodyBytes: 1024
  - id: block-mail-httpdns-config
    phase: request
    match:
      hosts:
        - appconf.mail.163.com
      schemes:
        - http
        - https
      pathRegex: ^/mailmaster/api/http/urlConfig\.do$
    script:
      mock:
        status: 200
        headers:
          Content-Type: application/json
        body: "{}"
      bodyMode: none
      timeoutMs: 200
      maxBodyBytes: 1024
  - id: block-91160-httpdns-broker
    phase: request
    match:
      hosts:
        - msglb.91160.com
      schemes:
        - https
      pathRegex: ^/msg/outer/broker/get$
    script:
      mock:
        status: 200
        headers:
          Content-Type: application/json
        body: "{}"
      bodyMode: none
      timeoutMs: 200
      maxBodyBytes: 1024
  - id: block-ximalaya-httpdns-linkeye
    phase: request
    match:
      hosts:
        - gslbali.ximalaya.com
      schemes:
        - https
      pathRegex: ^/linkeye-cloud/httpdns/
    script:
      reject: true
      bodyMode: none
      timeoutMs: 200
      maxBodyBytes: 1024
