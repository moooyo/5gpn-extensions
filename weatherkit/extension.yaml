apiVersion: 5gpn.io/v1
kind: Extension

metadata:
  id: io.5gpn.weatherkit
  name: WeatherKit Enhancer
  version: 8.0.0
  description: Runs the reviewed NSRingo WeatherKit release bundles on the gateway, or sends the same three paths to the reviewed upstream cloud endpoint.

permissions:
  persistentStorage: true
  network: true

traffic:
  captureHosts:
    - weatherkit.apple.com
  routingRules:
    - action: reject
      domain: weather-analytics-events.apple.com
    - action: reject
      domainSuffix: tthr.apple.com
    - action: reject
      domain: tether.edge.apple
    - action: reject
      domain: weatherkit.apple.com
      network: udp
      destinationPort: 443

settings:
  # Upstream publishes the same three paths twice: a release module that runs
  # the bundles in the client, and a repository module that rewrites all three
  # paths to a cloud endpoint and runs nothing locally. Both are carried here,
  # and one select chooses between them -- two booleans could each be switched
  # on, and this cannot. Every setting below Endpoint belongs to the bundles, so
  # cloud mode reads none of them.
  - key: Mode
    type: select
    label: Where the transformation happens
    description: Script runs the pinned upstream bundles on this gateway. Cloud sends all three matched paths to the selected endpoint, which fetches from Apple and transforms the response there.
    required: true
    options:
      - Script
      - Cloud
    default: Script
  - key: Endpoint
    type: select
    label: Cloud endpoint
    description: The host cloud mode sends captured requests to. It receives the request's headers, including Apple's authorization, and the exact coordinates in the path. Unused in Script mode.
    required: true
    options:
      - weatherkit.pages.dev
      - dev.weatherkit.pages.dev
    default: weatherkit.pages.dev
  # The bundles only merge $argument into their settings when this says so. The
  # switch defaults to reading persistent storage and ignoring $argument
  # entirely, which is what every setting below was doing until this was added.
  # One option, because the other branches would silently discard them again.
  - key: Storage
    type: select
    label: Settings source
    description: Selects where the bundle reads its settings. Only the manifest's own settings are supported.
    required: true
    options:
      - $argument
    default: $argument
  - key: Weather.Provider
    type: select
    label: Weather source
    description: Replaces the weather data with the selected provider. WeatherKit leaves Apple's own data in place.
    required: true
    options:
      - WeatherKit
      - ColorfulClouds
      - QWeather
    default: WeatherKit
  - key: NextHour.Provider
    type: select
    label: Next-hour precipitation source
    description: Fills in next-hour precipitation from the selected provider. WeatherKit adds nothing.
    required: true
    options:
      - WeatherKit
      - ColorfulClouds
      - QWeather
    default: WeatherKit
  - key: AirQuality.Calculate.Algorithm
    type: select
    label: Local air-quality algorithm
    description: Calculates the air-quality index locally from the reported pollutants.
    required: true
    options:
      - None
      - UBA
      - EU_EAQI
      - WAQI_InstantCast_US
      - WAQI_InstantCast_CN
      - WAQI_InstantCast_CN_25_DRAFT
    default: None
  - key: API.ColorfulClouds.Token
    type: text
    label: ColorfulClouds token
    description: ColorfulClouds API token. Required only when a ColorfulClouds source is selected.
    required: false
  # Upstream's own argument default, carried rather than left blank. $argument is
  # merged over the bundle's database defaults, so an empty value here would
  # overwrite devapi.qweather.com with "" and every QWeather URL would be built
  # against https:// with no host. That now decides whether the weather-alerts
  # action can answer at all, not just whether a comparison lookup succeeds.
  - key: API.QWeather.Host
    type: text
    label: QWeather host
    description: QWeather API host. Upstream's default is devapi.qweather.com.
    required: false
    default: devapi.qweather.com
  - key: API.QWeather.Token
    type: text
    label: QWeather token
    description: QWeather API token. Required only when a QWeather source is selected.
    required: false
  - key: API.WAQI.Token
    type: text
    label: WAQI token
    description: WAQI API token. Selects the WAQI premium API when set.
    required: false
  - key: LogLevel
    type: select
    label: Script log level
    description: Bundle log verbosity. Output goes only to the plugin engine log ring.
    required: true
    options:
      - "OFF"
      - ERROR
      - WARN
      - INFO
      - DEBUG
      - ALL
    default: WARN

actions:
  # Gateway script mode: the three scripts the published release module declares
  # -- two response scripts and, since v3.2.0-beta5, one request script --
  # running the pinned bundles here. The three paths are disjoint, so upstream's
  # declaration order carries no meaning and the request action is appended
  # rather than interleaved.
  - id: weather-availability
    phase: response
    enabledWhen:
      key: Mode
      equals: Script
    match:
      hosts:
        - weatherkit.apple.com
      schemes:
        - http
        - https
      pathRegex: '^/api/v1/availability/'
      statusCodes:
        - 200
    script:
      source: https://github.com/NSRingo/WeatherKit/releases/download/v3.2.0/response.bundle.js
      bodyMode: text
      entry: proxy-compat
      timeoutMs: 10000
      maxBodyBytes: 65536
  - id: weather-data
    phase: response
    enabledWhen:
      key: Mode
      equals: Script
    match:
      hosts:
        - weatherkit.apple.com
      schemes:
        - http
        - https
      methods:
        - GET
      pathRegex: '^/api/v2/weather/'
      statusCodes:
        - 200
    script:
      source: https://github.com/NSRingo/WeatherKit/releases/download/v3.2.0/response.bundle.js
      bodyMode: binary
      entry: proxy-compat
      timeoutMs: 25000
      maxBodyBytes: 16777216
  # The request script upstream added in v3.2.0-beta5. It does not edit a
  # request and forward it: for this path it answers locally, fetching the
  # alerts from QWeather with the coordinates in the query and returning a
  # synthesized 200. The path regex is upstream's own matcher transcribed, and
  # the `&ids=<latitude>,<longitude>` constraint is the whole gate -- Apple's
  # native alerts carry UUIDs, and only the response bundle above rewrites an
  # alert collection's detailsUrl to the coordinate form this matches. v3.2.0
  # tightened it: a coordinate now needs a digit before any decimal point, so
  # the bare `.5` form upstream once accepted is no longer selected. Upstream
  # declares no requires-body for it, so no request body is delivered.
  - id: weather-alerts
    phase: request
    enabledWhen:
      key: Mode
      equals: Script
    match:
      hosts:
        - weatherkit.apple.com
      schemes:
        - http
        - https
      pathRegex: '^/api/v1/weatherAlerts\?[^#]*&ids=-?[0-9]+(?:\.[0-9]+)?,-?[0-9]+(?:\.[0-9]+)?(?:&|$)'
    script:
      source: https://github.com/NSRingo/WeatherKit/releases/download/v3.2.0/request.bundle.js
      bodyMode: none
      entry: proxy-compat
      timeoutMs: 10000
      maxBodyBytes: 1048576
  # Cloud endpoint mode: the three URL rewrites the upstream Rewrite module
  # declares, with its endpoint argument carried as a setting the same way Loon
  # interpolates {endpoint} into the rewrite line. No script runs, on the gateway
  # or in the client, and the response this extension sees is whatever that host
  # returns. The matchers are the script actions' own, so both modes cover
  # exactly the same traffic and Mode changes only how it is handled.
  - id: weather-availability-cloud
    phase: request
    enabledWhen:
      key: Mode
      equals: Cloud
    match:
      hosts:
        - weatherkit.apple.com
      schemes:
        - http
        - https
      pathRegex: '^/api/v1/availability/'
    script:
      rewrite:
        pattern: '^https?://weatherkit\.apple\.com/api/v1/availability/(.*)$'
        to: https://{{settings.Endpoint}}/api/v1/availability/$1
      bodyMode: none
      timeoutMs: 500
      maxBodyBytes: 65536
  - id: weather-data-cloud
    phase: request
    enabledWhen:
      key: Mode
      equals: Cloud
    match:
      hosts:
        - weatherkit.apple.com
      schemes:
        - http
        - https
      methods:
        - GET
      pathRegex: '^/api/v2/weather/'
    script:
      rewrite:
        pattern: '^https?://weatherkit\.apple\.com/api/v2/weather/(.*)$'
        to: https://{{settings.Endpoint}}/api/v2/weather/$1
      bodyMode: none
      timeoutMs: 500
      maxBodyBytes: 65536
  # Cloud mode's twin of weather-alerts. The match is the script action's own so
  # the two modes still select the same exchanges; the rewrite pattern is
  # upstream's, which captures the whole query string and replays it after the
  # path, so the coordinates reach the endpoint exactly as the client sent them.
  # v3.2.0 moved the `?` out of the capture group and onto the target, and
  # tightened the coordinate form the same way the script matcher was tightened.
  - id: weather-alerts-cloud
    phase: request
    enabledWhen:
      key: Mode
      equals: Cloud
    match:
      hosts:
        - weatherkit.apple.com
      schemes:
        - http
        - https
      pathRegex: '^/api/v1/weatherAlerts\?[^#]*&ids=-?[0-9]+(?:\.[0-9]+)?,-?[0-9]+(?:\.[0-9]+)?(?:&|$)'
    script:
      rewrite:
        pattern: '^https?://weatherkit\.apple\.com/api/v1/weatherAlerts\?([^#]*&ids=-?[0-9]+(?:\.[0-9]+)?,-?[0-9]+(?:\.[0-9]+)?(?:&[^#]*)?)$'
        to: https://{{settings.Endpoint}}/api/v1/weatherAlerts?$1
      bodyMode: none
      timeoutMs: 500
      maxBodyBytes: 65536
