apiVersion: 5gpn.io/v1
kind: Extension

metadata:
  id: io.5gpn.weatherkit
  name: WeatherKit Enhancer
  version: 5.0.0
  description: Runs the reviewed NSRingo WeatherKit release bundle on the gateway, or sends the same two paths to the reviewed upstream cloud endpoint.

permissions:
  persistentStorage: true
  network: true

traffic:
  captureHosts:
    - weatherkit.apple.com
  routingRules:
    - action: reject
      domain: weather-analytics-events.apple.com
    - action: reject
      domainSuffix: tthr.apple.com
    - action: reject
      domain: tether.edge.apple
    - action: reject
      domain: weatherkit.apple.com
      network: udp
      destinationPort: 443

settings:
  # Upstream publishes the same two paths twice: a release module that runs the
  # bundle in the client, and a repository module that rewrites both paths to a
  # cloud endpoint and runs nothing locally. Both are carried here, and one
  # select chooses between them -- two booleans could each be switched on, and
  # this cannot. Every setting below Endpoint belongs to the bundle, so cloud
  # mode reads none of them.
  - key: Mode
    type: select
    label: Where the transformation happens
    description: Script runs the pinned upstream bundle on this gateway. Cloud sends both matched paths to the selected endpoint, which fetches from Apple and transforms the response there.
    required: true
    options:
      - Script
      - Cloud
    default: Script
  - key: Endpoint
    type: select
    label: Cloud endpoint
    description: The host cloud mode sends captured requests to. It receives the request's headers, including Apple's authorization, and the exact coordinates in the path. Unused in Script mode.
    required: true
    options:
      - weatherkit.pages.dev
      - dev.weatherkit.pages.dev
      - weather.nanocat.cloud
    default: weatherkit.pages.dev
  # The bundle only merges $argument into its settings when this says so. Its
  # switch defaults to reading persistent storage and ignoring $argument
  # entirely, which is what every setting below was doing until this was added.
  # One option, because the other branches would silently discard them again.
  - key: Storage
    type: select
    label: Settings source
    description: Selects where the bundle reads its settings. Only the manifest's own settings are supported.
    required: true
    options:
      - $argument
    default: $argument
  - key: Weather.Provider
    type: select
    label: Weather source
    description: Replaces the weather data with the selected provider. WeatherKit leaves Apple's own data in place.
    required: true
    options:
      - WeatherKit
      - ColorfulClouds
      - QWeather
    default: WeatherKit
  - key: NextHour.Provider
    type: select
    label: Next-hour precipitation source
    description: Fills in next-hour precipitation from the selected provider. WeatherKit adds nothing.
    required: true
    options:
      - WeatherKit
      - ColorfulClouds
      - QWeather
    default: WeatherKit
  - key: AirQuality.Calculate.Algorithm
    type: select
    label: Local air-quality algorithm
    description: Calculates the air-quality index locally from the reported pollutants.
    required: true
    options:
      - None
      - UBA
      - EU_EAQI
      - WAQI_InstantCast_US
      - WAQI_InstantCast_CN
      - WAQI_InstantCast_CN_25_DRAFT
    default: None
  - key: API.ColorfulClouds.Token
    type: text
    label: ColorfulClouds token
    description: ColorfulClouds API token. Required only when a ColorfulClouds source is selected.
    required: false
  - key: API.QWeather.Host
    type: text
    label: QWeather host
    description: QWeather API host, for example devapi.qweather.com.
    required: false
  - key: API.QWeather.Token
    type: text
    label: QWeather token
    description: QWeather API token. Required only when a QWeather source is selected.
    required: false
  - key: API.WAQI.Token
    type: text
    label: WAQI token
    description: WAQI API token. Selects the WAQI premium API when set.
    required: false
  - key: LogLevel
    type: select
    label: Script log level
    description: Bundle log verbosity. Output goes only to the plugin engine log ring.
    required: true
    options:
      - "OFF"
      - ERROR
      - WARN
      - INFO
      - DEBUG
      - ALL
    default: WARN

actions:
  # Gateway script mode: the two response scripts the published release module
  # declares, running the pinned bundle here.
  - id: weather-availability
    phase: response
    enabledWhen:
      key: Mode
      equals: Script
    match:
      hosts:
        - weatherkit.apple.com
      schemes:
        - http
        - https
      pathRegex: '^/api/v1/availability/'
      statusCodes:
        - 200
    script:
      source: https://github.com/NSRingo/WeatherKit/releases/download/v3.2.0-beta2/response.bundle.js
      bodyMode: text
      entry: proxy-compat
      timeoutMs: 10000
      maxBodyBytes: 65536
  - id: weather-data
    phase: response
    enabledWhen:
      key: Mode
      equals: Script
    match:
      hosts:
        - weatherkit.apple.com
      schemes:
        - http
        - https
      methods:
        - GET
      pathRegex: '^/api/v2/weather/'
      statusCodes:
        - 200
    script:
      source: https://github.com/NSRingo/WeatherKit/releases/download/v3.2.0-beta2/response.bundle.js
      bodyMode: binary
      entry: proxy-compat
      timeoutMs: 25000
      maxBodyBytes: 16777216
  # Cloud endpoint mode: the two URL rewrites the upstream Rewrite module
  # declares, with its endpoint argument carried as a setting the same way Loon
  # interpolates {endpoint} into the rewrite line. No script runs, on the gateway
  # or in the client, and the response this extension sees is whatever that host
  # returns. The matchers are the script actions' own, so both modes cover
  # exactly the same traffic and Mode changes only how it is handled.
  - id: weather-availability-cloud
    phase: request
    enabledWhen:
      key: Mode
      equals: Cloud
    match:
      hosts:
        - weatherkit.apple.com
      schemes:
        - http
        - https
      pathRegex: '^/api/v1/availability/'
    script:
      rewrite:
        pattern: '^https?://weatherkit\.apple\.com/api/v1/availability/(.*)$'
        to: https://{{settings.Endpoint}}/api/v1/availability/$1
      bodyMode: none
      timeoutMs: 500
      maxBodyBytes: 65536
  - id: weather-data-cloud
    phase: request
    enabledWhen:
      key: Mode
      equals: Cloud
    match:
      hosts:
        - weatherkit.apple.com
      schemes:
        - http
        - https
      methods:
        - GET
      pathRegex: '^/api/v2/weather/'
    script:
      rewrite:
        pattern: '^https?://weatherkit\.apple\.com/api/v2/weather/(.*)$'
        to: https://{{settings.Endpoint}}/api/v2/weather/$1
      bodyMode: none
      timeoutMs: 500
      maxBodyBytes: 65536
