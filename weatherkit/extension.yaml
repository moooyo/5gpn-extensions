apiVersion: 5gpn.io/v1
kind: Extension

metadata:
  id: io.5gpn.weatherkit
  name: WeatherKit Enhancer
  version: 10.0.0
  description: Runs the reviewed NSRingo WeatherKit release bundles on the gateway, or applies the reviewed upstream cloud rewrites.

permissions:
  persistentStorage: true
  network: true

traffic:
  captureHosts:
    - weatherkit.apple.com
  routingRules:
    - action: reject
      domain: weather-analytics-events.apple.com
    - action: reject
      domainSuffix: tthr.apple.com
    - action: reject
      domain: tether.edge.apple

settings:
  # Upstream publishes a release module that runs five bundle actions and a
  # repository module that applies four rewrite rules across three pathnames to
  # a cloud endpoint. One select
  # chooses between them. The cloud module does not carry the release module's
  # airQualityScale request action, so that path stays with Apple in Cloud mode.
  - key: Mode
    type: select
    label: Where the transformation happens
    description: Script runs the pinned upstream bundles on this gateway. Cloud applies upstream's four rewrite rules across three pathnames; air-quality scale requests remain direct to Apple.
    required: true
    options:
      - Script
      - Cloud
    default: Script
  - key: Endpoint
    type: select
    label: Cloud endpoint
    description: The host cloud mode sends captured requests to. It receives the request's headers, including Apple's authorization, and any exact coordinates or alert identifiers in the URL. Unused in Script mode.
    required: true
    options:
      - weatherkit.pages.dev
      - dev.weatherkit.pages.dev
    default: weatherkit.pages.dev
  # The bundles only merge $argument into their settings when Storage selects
  # this branch. One option is deliberate: the other branches would discard the
  # manifest's typed settings and silently read an unavailable BoxJS store or
  # the bundle database instead.
  - key: Storage
    type: select
    label: Settings source
    description: Selects where the bundle reads its settings. Only the manifest's own settings are supported.
    required: true
    options:
      - $argument
    default: $argument
  # The official release asset exposes this comma-separated input even though
  # none of its five script lines attaches request.bundle.js to /api/v2/weather,
  # which is the only branch that reads it. It is carried for exact argument
  # parity and documented as currently ineffective rather than silently omitted.
  - key: DataSets
    type: text
    label: Requested datasets
    description: Comma-separated WeatherKit datasets from upstream's release module. The current official action wiring does not read this value, so changing it has no effect.
    required: true
    default: airQuality,currentWeather,forecastDaily,forecastHourly,forecastNextHour,weatherAlerts
  - key: Weather.Provider
    type: select
    label: Weather source
    description: Replaces the weather data with the selected provider. WeatherKit leaves Apple's own data in place.
    required: true
    options:
      - WeatherKit
      - ColorfulClouds
      - QWeather
    default: WeatherKit
  - key: WeatherAlerts.Provider
    type: select
    label: Weather-alert source
    description: Selects response-dataset completion and coordinate-form alert handling. Page-token requests always use QWeather Web; WeatherKit returns an empty local list for matched coordinate requests.
    required: true
    options:
      - WeatherKit
      - QWeatherWeb
      - QWeather
      - ColorfulClouds
    default: WeatherKit
  - key: NextHour.Provider
    type: select
    label: Next-hour precipitation source
    description: Fills in next-hour precipitation from the selected provider. WeatherKit adds nothing.
    required: true
    options:
      - WeatherKit
      - ColorfulClouds
      - QWeather
    default: WeatherKit
  - key: AirQuality.Current.Pollutants.Provider
    type: select
    label: Missing-pollutant source
    description: Selects the provider used when Apple's current air-quality response has no pollutant list. Both options can receive the exact coordinates.
    required: true
    options:
      - ColorfulClouds
      - QWeather
    default: ColorfulClouds
  - key: AirQuality.Calculate.Algorithm
    type: select
    label: Local air-quality algorithm
    description: Calculates the air-quality index locally from the reported pollutants.
    required: true
    options:
      - None
      - UBA
      - EU_EAQI
      - WAQI_InstantCast_US
      - WAQI_InstantCast_CN
      - WAQI_InstantCast_CN_25_DRAFT
      - CA_AQHI
      - HK_AQHI
      - AQHI_Multi_CN
      - AQHI_Multi_CN_HK
      - CN_DEATH_AQHI
      - CN_DEATH_HK_AQHI
    default: None
  - key: API.ColorfulClouds.Token
    type: text
    label: ColorfulClouds token
    description: Optional override for upstream's built-in ColorfulClouds service token.
    required: false
  # $argument is merged over the bundle's database defaults. An empty declared
  # value would overwrite devapi.qweather.com and build every QWeather URL
  # against a hostless https:// URL, so the upstream default is explicit here.
  - key: API.QWeather.Host
    type: text
    label: QWeather host
    description: QWeather API host. Upstream's default is devapi.qweather.com.
    required: false
    default: devapi.qweather.com
  - key: API.QWeather.Token
    type: text
    label: QWeather token
    description: Optional override for upstream's built-in QWeather service token.
    required: false
  - key: API.WAQI.Token
    type: text
    label: WAQI token
    description: WAQI API token. Selects the WAQI premium API when set.
    required: false
  - key: LogLevel
    type: select
    label: Script log level
    description: Bundle log verbosity. Output goes only to the plugin engine log ring.
    required: true
    options:
      - "OFF"
      - ERROR
      - WARN
      - INFO
      - DEBUG
      - ALL
    default: WARN

actions:
  # Gateway script mode transcribes the five script lines in the v3.3.0
  # Loon release asset. The two response actions share response.bundle.js; the
  # three request actions share request.bundle.js.
  - id: weather-availability
    phase: response
    enabledWhen:
      key: Mode
      equals: Script
    match:
      hosts:
        - weatherkit.apple.com
      schemes:
        - http
        - https
      pathRegex: '^/api/v1/availability/'
      statusCodes:
        - 200
    script:
      source: https://github.com/NSRingo/WeatherKit/releases/download/v3.3.0/response.bundle.js
      bodyMode: text
      entry: proxy-compat
      timeoutMs: 10000
      maxBodyBytes: 65536
  # The request bundle strips a trailing numeric version from every scale name.
  # It answers HK.AQHI and CN.AQHI locally with WeatherKit-compatible JSON and
  # forwards other normalized scale paths to Apple.
  - id: air-quality-scale
    phase: request
    enabledWhen:
      key: Mode
      equals: Script
    match:
      hosts:
        - weatherkit.apple.com
      schemes:
        - http
        - https
      pathRegex: '^/api/v1/airQualityScale/'
    script:
      source: https://github.com/NSRingo/WeatherKit/releases/download/v3.3.0/request.bundle.js
      bodyMode: none
      entry: proxy-compat
      timeoutMs: 10000
      maxBodyBytes: 1048576
  # QWeather page identifiers end in a hyphen followed by a nine-digit location
  # code. Stable v3.3.0 always fetches the corresponding QWeather page for this
  # form, regardless of WeatherAlerts.Provider.
  - id: weather-alerts-page
    phase: request
    enabledWhen:
      key: Mode
      equals: Script
    match:
      hosts:
        - weatherkit.apple.com
      schemes:
        - http
        - https
      pathRegex: '^/api/v1/weatherAlerts\?[^#]*&ids=[^&#]*-[0-9]{9}(?:&|$)'
    script:
      source: https://github.com/NSRingo/WeatherKit/releases/download/v3.3.0/request.bundle.js
      bodyMode: none
      entry: proxy-compat
      timeoutMs: 10000
      maxBodyBytes: 1048576
  # This stable action ID retains the coordinate-form matcher carried by 8.1.0.
  # ColorfulClouds uses its API, QWeather and QWeatherWeb use the QWeather API,
  # and WeatherKit returns a local empty array instead of forwarding to Apple.
  - id: weather-alerts
    phase: request
    enabledWhen:
      key: Mode
      equals: Script
    match:
      hosts:
        - weatherkit.apple.com
      schemes:
        - http
        - https
      pathRegex: '^/api/v1/weatherAlerts\?[^#]*&ids=-?[0-9]+(?:\.[0-9]+)?,-?[0-9]+(?:\.[0-9]+)?(?:&|$)'
    script:
      source: https://github.com/NSRingo/WeatherKit/releases/download/v3.3.0/request.bundle.js
      bodyMode: none
      entry: proxy-compat
      timeoutMs: 10000
      maxBodyBytes: 1048576
  - id: weather-data
    phase: response
    enabledWhen:
      key: Mode
      equals: Script
    match:
      hosts:
        - weatherkit.apple.com
      schemes:
        - http
        - https
      methods:
        - GET
      pathRegex: '^/api/v2/weather/'
      statusCodes:
        - 200
    script:
      source: https://github.com/NSRingo/WeatherKit/releases/download/v3.3.0/response.bundle.js
      bodyMode: binary
      entry: proxy-compat
      timeoutMs: 25000
      maxBodyBytes: 16777216
  # Cloud mode transcribes the four rewrites in the pinned repository module.
  # No cloud rewrite exists upstream for airQualityScale, so this action set is
  # intentionally one path smaller than Script mode.
  - id: weather-availability-cloud
    phase: request
    enabledWhen:
      key: Mode
      equals: Cloud
    match:
      hosts:
        - weatherkit.apple.com
      schemes:
        - http
        - https
      pathRegex: '^/api/v1/availability/'
    script:
      rewrite:
        pattern: '^https?://weatherkit\.apple\.com/api/v1/availability/(.*)$'
        to: https://{{settings.Endpoint}}/api/v1/availability/$1
      bodyMode: none
      timeoutMs: 500
      maxBodyBytes: 65536
  - id: weather-data-cloud
    phase: request
    enabledWhen:
      key: Mode
      equals: Cloud
    match:
      hosts:
        - weatherkit.apple.com
      schemes:
        - http
        - https
      methods:
        - GET
      pathRegex: '^/api/v2/weather/'
    script:
      rewrite:
        pattern: '^https?://weatherkit\.apple\.com/api/v2/weather/(.*)$'
        to: https://{{settings.Endpoint}}/api/v2/weather/$1
      bodyMode: none
      timeoutMs: 500
      maxBodyBytes: 65536
  - id: weather-alerts-page-cloud
    phase: request
    enabledWhen:
      key: Mode
      equals: Cloud
    match:
      hosts:
        - weatherkit.apple.com
      schemes:
        - http
        - https
      pathRegex: '^/api/v1/weatherAlerts\?[^#]*&ids=[^&#]*-[0-9]{9}(?:&|$)'
    script:
      rewrite:
        pattern: '^https?://weatherkit\.apple\.com/api/v1/weatherAlerts\?([^#]*&ids=[^&#]*-[0-9]{9}(?:&[^#]*)?)$'
        to: https://{{settings.Endpoint}}/api/v1/weatherAlerts?$1
      bodyMode: none
      timeoutMs: 500
      maxBodyBytes: 65536
  - id: weather-alerts-cloud
    phase: request
    enabledWhen:
      key: Mode
      equals: Cloud
    match:
      hosts:
        - weatherkit.apple.com
      schemes:
        - http
        - https
      pathRegex: '^/api/v1/weatherAlerts\?[^#]*&ids=-?[0-9]+(?:\.[0-9]+)?,-?[0-9]+(?:\.[0-9]+)?(?:&|$)'
    script:
      rewrite:
        pattern: '^https?://weatherkit\.apple\.com/api/v1/weatherAlerts\?([^#]*&ids=-?[0-9]+(?:\.[0-9]+)?,-?[0-9]+(?:\.[0-9]+)?(?:&[^#]*)?)$'
        to: https://{{settings.Endpoint}}/api/v1/weatherAlerts?$1
      bodyMode: none
      timeoutMs: 500
      maxBodyBytes: 65536
