apiVersion: 5gpn.io/v1
kind: Extension

metadata:
  id: io.5gpn.testflight-region-unlock
  name: TestFlight Region Unlock
  version: 2.0.0
  description: Rewrites the TestFlight install storefront and requires an operator-selected regional egress group.

permissions:
  persistentStorage: false

requirements:
  egressGroup:
    required: true

traffic:
  captureHosts:
    - testflight.apple.com

settings:
  - key: storefront
    type: select
    label: Target storefront
    description: Selects the Apple storefront region written into TestFlight install requests.
    required: true
    options:
      - US
      - GB
      - CA
      - AU
      - JP
      - HK
      - SG
      - CN
      - KR
      - TW
    default: US

actions:
  - id: rewrite-install-storefront
    phase: request
    match:
      hosts:
        - testflight.apple.com
      schemes:
        - http
        - https
      pathRegex: '^/v[0-9]/accounts/.+?/install$'
    script:
      jq: >-
        def ids: {"US":"143441-19,29","GB":"143444-19,29","CA":"143455-19,29","AU":"143460-19,29","JP":"143462-19,29","HK":"143463-19,29","SG":"143464-19,29","CN":"143465-19,29","KR":"143466-19,29","TW":"143470-19,29"}; if has("storefrontId") and (ids[$settings.storefront] != null) then .storefrontId = ids[$settings.storefront] else . end
      bodyMode: text
      timeoutMs: 500
      maxBodyBytes: 1048576
